<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme App</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#0f111a] min-h-screen flex items-center justify-center p-4 md:p-10 font-sans">

    <!-- Container หน้าเว็บ -->
    <div class="bg-[#f8f9fc] w-full max-w-7xl rounded-3xl p-8 md:p-16 flex flex-col justify-between min-h-[750px] shadow-2xl">
      
      <!-- การ์ดฟอร์มตรงกลาง -->
      <div class="bg-white rounded-2xl max-w-5xl w-full mx-auto p-8 md:p-12 shadow-sm my-auto">
        
        <h1 class="text-3xl md:text-4xl font-bold text-center text-slate-900 mb-8">
          Get in Touch
        </h1>
  
        <form action="#" method="POST" class="space-y-6">
          <!-- Name Input -->
          <div>
            <label for="name" class="block text-sm font-medium text-slate-500 mb-2">
              Name
            </label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              placeholder="Username" 
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-800 text-slate-700 placeholder-slate-400 transition"
            >
          </div>
  
          <!-- Email Input -->
          <div>
            <label for="email" class="block text-sm font-medium text-slate-500 mb-2">
              Email
            </label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="Email" 
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-800 text-slate-700 placeholder-slate-400 transition"
            >
          </div>
  
          <!-- Message Input -->
          <div>
            <label for="message" class="block text-sm font-medium text-slate-500 mb-2">
              Message
            </label>
            <textarea 
              id="message" 
              name="message" 
              rows="4" 
              placeholder="Your message..." 
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-800 text-slate-700 placeholder-slate-400 resize-y transition"
            ></textarea>
          </div>
  
          <!-- Submit Button -->
          <button 
            type="submit" 
            class="w-full bg-[#1b1c2b] hover:bg-green-600 text-white font-medium py-3.5 px-4 rounded-xl transition duration-200 shadow"
          >
            Submit
          </button>
        </form>
        
      </div>
  
      <!-- Footer -->
      <div class="flex flex-col sm:flex-row justify-between items-center text-xs md:text-sm font-medium text-slate-600 mt-12 pt-4 gap-4">
        <div>
          Acme productivity app ©2024
        </div>
        <div class="flex items-center space-x-6">
          <a href="#" class="hover:text-slate-900 transition">FAQ</a>
          <a href="#" class="hover:text-slate-900 transition">Terms</a>
          <a href="#" class="hover:text-slate-900 transition">AI Policy</a>
          <a href="#" class="hover:text-slate-900 transition">Pricing</a>
        </div>
      </div>
  
    </div>
  
  </body>
  </html>
